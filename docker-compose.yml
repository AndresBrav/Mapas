services:
    redis:
        image: redis:7-alpine
        container_name: redis
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        ports:
            - "${REDIS_PORT}:6379"
        volumes:
            - redis-data:/data
        command: redis-server --requirepass ${REDIS_PASSWORD}
        restart: unless-stopped

    postgres:
        image: postgres:15-alpine
        container_name: postgres
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${P_DB_USER} -d $${P_DB_NAME}"]
            interval: 5s
            timeout: 3s
            retries: 5
        environment:
            POSTGRES_DB: ${P_DB_NAME}
            POSTGRES_USER: ${P_DB_USER}
            POSTGRES_PASSWORD: ${P_DB_PASSWORD}
        ports:
            - "${P_DB_PORT}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        restart: unless-stopped

    app:
        build: .
        container_name: p25-geo-app
        ports:
            - "${PORT}:${PORT}"
        env_file: .env
        environment:
            - REDIS_HOST=redis
            - P_DB_HOST=postgres
            - NOMINATIM_BASE_URL=http://mock-maps:4000/search
            - OSRM_BASE_URL=http://mock-maps:4000/route/v1/driving
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
            mock-maps:
                condition: service_started
        restart: unless-stopped

    mock-maps:
        build: ./test/mock-server
        container_name: mock-maps
        ports:
            - "4000:4000"

    trivy-scan:
        profiles: ["trivy"]
        image: aquasec/trivy:latest
        container_name: trivy-scan
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - trivy-db:/root/.cache/trivy
        command: >
            image --scanners vuln
            --severity CRITICAL,HIGH
            --exit-code 1
            --ignore-unfixed
            p25-geo-app:latest

    k6-load-test:
        profiles: ["k6"]
        image: grafana/k6:latest
        container_name: k6-load-test
        volumes:
            - ./test/k6:/scripts
        network_mode: "host"
        command: run /scripts/load_test.js

    zap-scan:
        profiles: ["zap"]
        image: ghcr.io/zaproxy/zaproxy:stable
        container_name: zap-scan
        depends_on:
            app:
                condition: service_started
        environment:
            - ZAP_JVM_OPTS=-Xmx512m
        command: >
            zap-api-scan.py
            -t /zap/openapi.yaml
            -f openapi
            -O http://app:3050/v1
            -r zap-report.html
            -J zap-report.json
            -w zap-report.md
            -l FAIL
            -I
            -S
            -z "-config autoupdate.checkonstart=false
                -config autoupdate.downloadnewrelease=false
                -config replacer.full_list(0).description=auth1
                -config replacer.full_list(0).enabled=true
                -config replacer.full_list(0).matchtype=REQ_HEADER
                -config replacer.full_list(0).matchstr=x-clientid
                -config replacer.full_list(0).replacement=envio-app
                -config replacer.full_list(0).initiators=3
                -config replacer.full_list(1).description=auth2
                -config replacer.full_list(1).enabled=true
                -config replacer.full_list(1).matchtype=REQ_HEADER
                -config replacer.full_list(1).matchstr=x-client-secret
                -config replacer.full_list(1).replacement=123456789ABC
                -config replacer.full_list(1).initiators=3"
        volumes:
            - ./docs/openapi.yaml:/zap/openapi.yaml:ro
            - ./docs/evidencias:/zap/wrk

volumes:
    redis-data:
    postgres-data:
    trivy-db:
        external: true
