services:
    redis:
        image: redis:7-alpine
        container_name: redis
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        ports:
            - "${REDIS_PORT}:6379"
        volumes:
            - redis-data:/data
        command: redis-server --requirepass ${REDIS_PASSWORD}
        restart: unless-stopped

    postgres:
        image: postgres:15-alpine
        container_name: postgres
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${P_DB_USER} -d $${P_DB_NAME}"]
            interval: 5s
            timeout: 3s
            retries: 5
        environment:
            POSTGRES_DB: ${P_DB_NAME}
            POSTGRES_USER: ${P_DB_USER}
            POSTGRES_PASSWORD: ${P_DB_PASSWORD}
        ports:
            - "${P_DB_PORT}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        restart: unless-stopped

    app:
        build: .
        image: p25-geo-app
        container_name: p25-geo-app
        ports:
            - "${PORT}:${PORT}"
        env_file: .env
        environment:
            - REDIS_HOST=redis
            - P_DB_HOST=postgres
            - NOMINATIM_BASE_URL=http://mock-maps:4000/search
            - OSRM_BASE_URL=http://mock-maps:4000/route/v1/driving
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "require('http').get({hostname:'localhost',port:process.env.PORT||3050,path:'/v1/health'},r=>r.statusCode===200?process.exit(0):process.exit(1)).on('error',()=>process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 8
            start_period: 20s
        restart: unless-stopped

    mock-maps:
        build: ./test/mock-server
        container_name: mock-maps
        ports:
            - "4000:4000"

    trivy-scan:
        profiles: ["trivy"]
        image: aquasec/trivy:latest
        container_name: trivy-scan
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - trivy-db:/root/.cache/trivy
            - ${PWD}/6_Escaneo_contenedor_Trivy:/reports
        command: >
            image --scanners vuln
            --severity CRITICAL,HIGH
            --exit-code 0
            --ignore-unfixed
            --output /reports/6.1_Salida_Trivy.txt
            p25-geo-app:latest

    k6-load-test:
        profiles: ["k6"]
        image: grafana/k6:latest
        container_name: k6-load-test
        user: root
        depends_on:
            app:
                condition: service_healthy
            mock-maps:
                condition: service_started
        volumes:
            - ${PWD}/test/k6:/scripts
            - ${PWD}/7_Pruebas_carga_K6:/reports
        environment:
            - BASE_URL=http://host.docker.internal:3050/v1
        extra_hosts:
            - "host.docker.internal:host-gateway"
        command: run /scripts/load_test.js

    zap-scan:
        profiles: ["zap"]
        image: ghcr.io/zaproxy/zaproxy:stable
        container_name: zap-scan
        user: root
        depends_on:
            app:
                condition: service_healthy
        environment:
            - ZAP_JVM_OPTS=-Xmx512m
        extra_hosts:
            - "host.docker.internal:host-gateway"
        command: >
            zap-api-scan.py
            -t http://host.docker.internal:3050/api-docs/swagger.json
            -f openapi
            -O http://host.docker.internal:3050/v1
            -r 5.1_Reporte_DAST_AppScan.html
            -J 5.1_Reporte_DAST_AppScan.json
            -w 5.1_Reporte_DAST_AppScan.md
            -l FAIL
            -I
            -S
            -z "-config autoupdate.checkonstart=false
                -config autoupdate.downloadnewrelease=false
                -config replacer.full_list(0).description=auth1
                -config replacer.full_list(0).enabled=true
                -config replacer.full_list(0).matchtype=REQ_HEADER
                -config replacer.full_list(0).matchstr=x-clientid
                -config replacer.full_list(0).replacement=envio-app
                -config replacer.full_list(0).initiators=3
                -config replacer.full_list(1).description=auth2
                -config replacer.full_list(1).enabled=true
                -config replacer.full_list(1).matchtype=REQ_HEADER
                -config replacer.full_list(1).matchstr=x-client-secret
                -config replacer.full_list(1).replacement=123456789ABC
                -config replacer.full_list(1).initiators=3"
        volumes:
            - ${PWD}/5_Seguridad_DAST:/zap/wrk

volumes:
    redis-data:
    postgres-data:
    trivy-db:
        external: true

networks:
    default:
